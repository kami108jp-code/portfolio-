  { name:"iShares Silver Trust", nameJa:"銀ETF SLV", ticker:"SLV", type:"commodity", market:"US", note:"銀ETF" },
];

function searchBuiltin(q) {
  if (!q) return [];
  const kw = q.toLowerCase();
  return BUILTIN_STOCKS.filter(s =>
    s.name.toLowerCase().includes(kw) ||
    (s.nameJa && s.nameJa.toLowerCase().includes(kw)) ||
    s.ticker.toLowerCase().includes(kw) ||
    s.note.toLowerCase().includes(kw)
  ).slice(0, 8);
}

function formatJPY(n) {
  n = Number(n) || 0;
  if (n >= 100000000) return `${(n/100000000).toFixed(2)}億円`;
  if (n >= 10000) return `${(n/10000).toFixed(1)}万円`;
  return `${Math.round(n).toLocaleString()}円`;
}

function toYahooSymbol(ticker, type) {
  if (!ticker || type === "cash") return null;
  const t = ticker.trim();
  if (/^\d{4,5}$/.test(t)) return t + ".T";
  if (/^\d{8,}/.test(t)) return null;
  return t.toUpperCase();
}

async function fetchPrice(symbol) {
  try {
    const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=1d`);
    const data = await res.json();
    const price = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
    const currency = data?.chart?.result?.[0]?.meta?.currency;
    return { price, currency };
  } catch { return null; }
}

function detectType(name, ticker) {
  const n = name || ""; const t = ticker || "";
  if (GOLD_TICKERS.includes(t.toUpperCase()) || (n.includes("金") && (n.includes("ETF") || n.includes("ゴールド") || n.includes("Gold") || n.includes("投資信託") || n.includes("ファンド")))) return "gold";
  if (n.includes("REIT") || n.includes("リート") || n.includes("不動産")) return "reit";
  if (n.includes("原油") || n.includes("銀") || t === "SLV" || t === "USO") return "commodity";
  if (n.includes("スリム") || n.includes("ファンド") || n.includes("Fund") || n.includes("投資信託")) return "fund";
  return "stock";
}

// CSVパーサー
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  if (lines[0].charCodeAt(0) === 0xFEFF) lines[0] = lines[0].slice(1);
  const header = lines[0].split(",").map(h => h.replace(/"/g,"").trim());
  const results = [];
  const isMFAcc   = header.some(h => h.includes("金融機関") || h.includes("残高"));
  const isMonexF  = header.some(h => h.includes("ファンド名称") || h.includes("保有口数"));
  const isMonex   = header.some(h => h.includes("銘柄名称") || h.includes("概算評価額"));
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(",");
    const row = cols.map(c => c.replace(/^"|"$/g,"").trim());
    if (row.every(c => !c)) continue;
    const get = (...keys) => { for (const k of keys) { const idx = header.findIndex(h => h.includes(k)); if (idx >= 0 && row[idx]) return row[idx].replace(/,/g,""); } return ""; };
    const num = s => parseFloat(s.replace(/[^0-9.-]/g,"")) || 0;
    if (isMonexF) {
      const name = get("ファンド名称","ファンド名"); if (!name) continue;
      const amount = num(get("保有口数")); const priceStr = get("基準価額"); const totalStr = get("概算評価額","評価額");
      const price = num(priceStr) || (totalStr ? num(totalStr) / (amount||1) : 0);
      results.push({ id: Date.now()+i, type:"fund", name, ticker: get("ファンドコード","コード"), amount: amount||1, price });
    } else if (isMonex) {
      const name = get("銘柄名称","銘柄名"); if (!name) continue;
      const ticker = get("銘柄コード","ティッカー","コード");
      const amount = num(get("保有株数","保有数量")); const priceStr = get("現在値","参考取得単価"); const totalStr = get("概算評価額","評価額");
      const price = num(priceStr) || (totalStr ? num(totalStr) / (amount||1) : 0);
      results.push({ id: Date.now()+i, type: detectType(name, ticker), name, ticker, amount: amount||1, price });
    } else if (isMFAcc) {
      const name = get("口座名","金融機関","名称"); const totalStr = get("残高","金額","評価額");
      if (!name || !totalStr) continue;
      results.push({ id: Date.now()+i, type:"cash", name, ticker:"", amount: num(totalStr), price:1 });
    } else {
      const name = get("銘柄名","銘柄","ファンド名"); if (!name) continue;
      const ticker = get("コード","銘柄コード","ティッカー");
      const amount = num(get("保有数","保有口数","数量","保有株数")); const priceStr = get("現在値","基準価額","評価単価"); const totalStr = get("評価額","時価評価額","評価金額");
      const price = num(priceStr) || (totalStr ? num(totalStr) / (amount||1) : 0);
      results.push({ id: Date.now()+i, type: detectType(name, ticker), name, ticker, amount: amount||1, price });
    }
  }
  return results;
}

// ドーナツチャート
function DonutChart({ data, total }) {
  const size=180, r=65, cx=size/2, cy=size/2;
  let cum = -Math.PI/2;
  const slices = data.filter(d => d.value > 0).map(d => {
    const angle = (d.value/total)*2*Math.PI;
    const x1=cx+r*Math.cos(cum), y1=cy+r*Math.sin(cum);
    cum += angle;
    const x2=cx+r*Math.cos(cum), y2=cy+r*Math.sin(cum);
    return { ...d, path:`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${angle>Math.PI?1:0} 1 ${x2} ${y2} Z` };
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {slices.map((s,i) => <path key={i} d={s.path} fill={s.color} opacity="0.88" stroke="#1a1a1a" strokeWidth="2"/>)}
      <circle cx={cx} cy={cy} r={r*0.52} fill="#1a1a1a"/>
      <text x={cx} y={cy-5} textAnchor="middle" fill="#C8A97E" fontSize="10" fontFamily="'Noto Serif JP',serif">総資産</text>
      <text x={cx} y={cy+10} textAnchor="middle" fill="#f0ead6" fontSize="8" fontFamily="'Noto Serif JP',serif">{formatJPY(total)}</text>
    </svg>
  );
}

  const [show, setShow]     = useState(false);
  const contRef = useRef(null);

  useEffect(() => {
    const fn = e => { if (contRef.current && !contRef.current.contains(e.target)) setShow(false); };

    return () => document.removeEventListener("mousedown", fn);
  }, []);

    <div ref={contRef} style={{position:"relative"}}>

              </div>

      const pension = Math.round(allA.filter(a=>a.type==="fund"&&a.name.includes("年金")).reduce((s,a)=>s+a.amount*a.price,0));
      const self_total = Math.round((data.self||[]).reduce((s,a)=>s+a.amount*a.price,0));
      const wife_total = Math.round((data.wife||[]).reduce((s,a)=>s+a.amount*a.price,0));
      const daughter_total = Math.round((data.daughter||[]).reduce((s,a)=>s+a.amount*a.price,0));
      const son_total = Math.round((data.son||[]).reduce((s,a)=>s+a.amount*a.price,0));
      const today = new Date().toISOString().split("T")[0];
      const row = {recorded_at:today,total,cash,fund,pension,self_total,wife_total,daughter_total,son_total};
      const res = await fetch(`${sbUrl}/rest/v1/history`,{method:"POST",headers:{"apikey":sbKey,"Authorization":`Bearer ${sbKey}`,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(row)});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      setStatus(`✅ ${today} のスナップショットを保存しました！`);
    }catch(e){setStatus("❌ "+e.message);}
    setSyncing(false);setTimeout(()=>setStatus(""),6000);
  }

  return (
    <div style={{position:"fixed",inset:0,background:"#000c",zIndex:300,display:"flex",alignItems:"flex-end"}} onClick={onClose}>
      <div style={{background:"#141414",border:"1px solid #2e2a22",borderRadius:"16px 16px 0 0",padding:24,width:"100%",maxWidth:800,margin:"0 auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:14,color:"#C8A97E",fontWeight:700}}>☁️ Supabase同期</div>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:"#5a5040",fontSize:22,cursor:"pointer"}}>×</button>
        </div>
        <div style={{fontSize:11,color:"#5a5040",lineHeight:1.9,marginBottom:14}}>SupabaseのAPIキーページからURLとキーを取得して入力</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <div style={{fontSize:11,color:"#8a7a60"}}>Project URL（https://xxx.supabase.co）</div>
          <input style={is} placeholder="https://xxxxxxxxxx.supabase.co" value={sbUrl} onChange={e=>setSbUrl(e.target.value.trim())}/>
          <div style={{fontSize:11,color:"#8a7a60",marginTop:4}}>APIキー（sb_publishable_...）</div>
          <input style={{...is,fontFamily:"monospace",fontSize:11}} placeholder="sb_publishable_..." value={sbKey} onChange={e=>setSbKey(e.target.value.trim())}/>
        </div>
        <button onClick={saveSettings} style={{background:"transparent",border:"1px solid #C8A97E44",borderRadius:8,color:"#C8A97E",padding:"8px 14px",fontFamily:"'Noto Serif JP',serif",fontSize:12,cursor:"pointer",marginTop:12,width:"100%"}}>設定を保存</button>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:10}}>
          <button onClick={load} disabled={syncing} style={{background:"#1a2a1a",border:"1px solid #8BA88844",borderRadius:8,color:"#8BA888",padding:10,fontFamily:"'Noto Serif JP',serif",fontSize:12,cursor:syncing?"not-allowed":"pointer"}}>⬇️ 読込</button>
          <button onClick={save} disabled={syncing} style={{background:"linear-gradient(135deg,#C8A97E,#a8855a)",border:"none",borderRadius:8,color:"#1a1a1a",padding:10,fontFamily:"'Noto Serif JP',serif",fontSize:12,cursor:syncing?"not-allowed":"pointer",fontWeight:700}}>⬆️ 保存</button>
        </div>
        <button onClick={saveSnapshot} disabled={syncing} style={{background:"linear-gradient(135deg,#2a1a3a,#1a0a2a)",border:"1px solid #9E8EC855",borderRadius:8,color:"#9E8EC8",padding:"10px",width:"100%",fontFamily:"'Noto Serif JP',serif",fontSize:12,cursor:syncing?"not-allowed":"pointer",marginTop:8}}>📸 今日の資産をスナップショット保存</button>
        {status&&<div style={{marginTop:10,textAlign:"center",fontSize:12,color:status.startsWith("✅")?"#8BA888":status.startsWith("❌")?"#c87e7e":"#C8A97E",background:"#0d0d0d",borderRadius:8,padding:8}}>{status}</div>}
      </div>
    </div>
  );
}

function MemberView({ member, assets, setAssets, historyRecords }) {
  const [showAdd, setShowAdd] = useState(false);
  const [showCSV, setShowCSV] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({type:"stock",name:"",ticker:"",amount:"",price:""});
  const [updating, setUpdating] = useState(false);
  const [upStatus, setUpStatus] = useState("");
  const [usdJpy, setUsdJpy] = useState(150);

  const total = assets.reduce((s,a)=>s+a.amount*a.price,0);
  const byType={}; assets.forEach(a=>{byType[a.type]=(byType[a.type]||0)+a.amount*a.price;});
  const donut = Object.entries(byType).map(([t,v])=>({label:TYPE_LABELS[t],value:v,color:TYPE_COLORS[t]}));
  const is = {background:"#0d0d0d",border:"1px solid #2e2a22",borderRadius:8,color:"#d4c9b0",fontFamily:"'Noto Serif JP',serif",fontSize:13,padding:"8px 12px",width:"100%",boxSizing:"border-box",outline:"none"};

  async function updatePrices() {
    setUpdating(true); setUpStatus("為替取得中...");
    let rate=usdJpy;
    try{const r=await fetchPrice("USDJPY=X");if(r?.price){rate=r.price;setUsdJpy(rate);}}catch{}
    const upd=assets.filter(a=>toYahooSymbol(a.ticker,a.type));
    if(!upd.length){setUpStatus("⚠️ ティッカー未設定");setUpdating(false);setTimeout(()=>setUpStatus(""),3000);return;}
    let ok=0,ng=0; const na=[...assets];
    for(let i=0;i<upd.length;i++){
      const a=upd[i]; setUpStatus(`取得中 ${i+1}/${upd.length} (${a.name})`);
      const sym=toYahooSymbol(a.ticker,a.type); const r=await fetchPrice(sym);
      if(r?.price){let p=r.price;if(r.currency==="USD")p=Math.round(p*rate);const idx=na.findIndex(x=>x.id===a.id);if(idx>=0)na[idx]={...na[idx],price:p};ok++;}else ng++;
      await new Promise(r=>setTimeout(r,300));
    }
    setAssets(na);
    const t=new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
    setUpStatus(`✅ ${ok}件更新${ng>0?` / ${ng}件失敗`:""} (${t} / ¥${rate.toFixed(1)}/USD)`);
    setUpdating(false); setTimeout(()=>setUpStatus(""),5000);
  }

  function save() {
    if(!form.name||!form.amount||!form.price) return;
    if(editId!==null) setAssets(assets.map(a=>a.id===editId?{...a,...form,amount:Number(form.amount),price:Number(form.price)}:a));
    else setAssets([...assets,{id:Date.now(),...form,amount:Number(form.amount),price:Number(form.price)}]);
    setEditId(null); setForm({type:"stock",name:"",ticker:"",amount:"",price:""}); setShowAdd(false);
  }

  return (
    <div>
      {showCSV && <CSVModal memberName={member.name} onImport={(p,m)=>setAssets(m==="replace"?p:[...assets,...p])} onClose={()=>setShowCSV(false)}/>}
      <div style={{background:"#141414",border:"1px solid #2e2a22",borderRadius:12,padding:16,marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:14}}>
          <div style={{fontSize:36}}>{member.icon}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:16,fontWeight:700,color:"#f0ead6"}}>{member.name}</div>
            <div style={{fontSize:20,fontWeight:700,color:"#C8A97E",marginTop:2}}>{formatJPY(total)}</div>
            {(()=>{
              const rd=window.REAL_DATA;if(!rd)return null;
              const ma=rd[member.id]||[];
              const cost=ma.reduce((s,a)=>s+(a.cost||a.amount*a.price),0);
              const gr=cost>0?(total-cost)/cost*100:0;
              const gain=total-cost;
              return <div style={{fontSize:12,color:gr>=0?"#8BA888":"#c87e7e",marginTop:2}}>{gr>=0?"+":""}{gr.toFixed(1)}% ({gain>=0?"+":""}{Math.round(gain/10000)}万円)</div>;
            })()}
          </div>
        </div>
        <DonutChart data={donut} total={total}/>
        <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:12}}>
          {donut.map(d=>(
            <div key={d.label} style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{width:10,height:10,borderRadius:2,background:d.color,flexShrink:0,display:"inline-block"}}/>
              <span style={{flex:1,fontSize:12,color:"#a09070"}}>{d.label}</span>
              <span style={{fontSize:12,color:"#d4c9b0",fontWeight:600}}>{total>0?(d.value/total*100).toFixed(1):0}%</span>
              <span style={{fontSize:11,color:"#5a5040",minWidth:70,textAlign:"right"}}>{formatJPY(d.value)}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{background:"#141414",border:"1px solid #2e2a22",borderRadius:12,padding:16,marginBottom:14}}>
        <div style={{fontSize:13,color:"#C8A97E",fontWeight:600,marginBottom:8}}>📈 資産推移</div>
        <div style={{fontSize:10,color:"#3a3028",marginBottom:10}}>毎月アプリを開くと自動記録</div>
        <HistoryChart records={historyRecords} valueKey={member.id+"_total"} color="#C8A97E"/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end",flexWrap:"wrap"}}>
          <button onClick={updatePrices} disabled={updating} style={{background:"transparent",border:"1px solid #8BA88855",borderRadius:8,color:"#8BA888",padding:"8px 14px",fontFamily:"'Noto Serif JP',serif",fontSize:12,cursor:updating?"not-allowed":"pointer"}}>{updating?"⏳ 取得中...":"🔄 価格更新"}</button>
          <button onClick={()=>setShowCSV(true)} style={{background:"transparent",border:"1px solid #C8A97E55",borderRadius:8,color:"#C8A97E",padding:"8px 14px",fontFamily:"'Noto Serif JP',serif",fontSize:12,cursor:"pointer"}}>📂 CSV読込</button>
          <button onClick={()=>{setShowAdd(true);setEditId(null);setForm({type:"stock",name:"",ticker:"",amount:"",price:""}); }} style={{background:"linear-gradient(135deg,#C8A97E,#a8855a)",color:"#1a1a1a",border:"none",borderRadius:8,padding:"8px 16px",fontFamily:"'Noto Serif JP',serif",fontSize:12,cursor:"pointer",fontWeight:700}}>＋ 追加</button>
        </div>
        {upStatus&&<div style={{fontSize:11,color:upStatus.startsWith("✅")?"#8BA888":upStatus.startsWith("⚠️")?"#C8A97E":"#7E9EC8",background:"#0d0d0d",borderRadius:8,padding:"7px 12px",textAlign:"center"}}>{upStatus}</div>}
        {showAdd && (
          <div style={{background:"#141414",border:"1px solid #C8A97E44",borderRadius:12,padding:18,display:"flex",flexDirection:"column",gap:10}}>
            <div style={{fontSize:13,color:"#C8A97E",fontWeight:600}}>{editId!==null?"編集":"資産を追加"}</div>
            <select style={is} value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
              {Object.entries(TYPE_LABELS).map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
            <TickerSearch form={form} setForm={setForm} inputStyle={is}/>
            {form.ticker&&<div style={{fontSize:11,color:"#5a5040",padding:"2px 4px"}}>ティッカー: <span style={{color:"#C8A97E"}}>{form.ticker}</span></div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <input style={is} placeholder="数量 / 金額" type="number" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})}/>
              <input style={is} placeholder="単価（円）" type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})}/>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={()=>{setShowAdd(false);setEditId(null);}} style={{background:"transparent",color:"#5a5040",border:"1px solid #2e2a22",borderRadius:8,padding:"7px 14px",fontFamily:"'Noto Serif JP',serif",fontSize:12,cursor:"pointer"}}>キャンセル</button>
              <button onClick={save} style={{background:"linear-gradient(135deg,#C8A97E,#a8855a)",color:"#1a1a1a",border:"none",borderRadius:8,padding:"7px 16px",fontFamily:"'Noto Serif JP',serif",fontSize:12,cursor:"pointer",fontWeight:700}}>保存</button>
            </div>
          </div>
        )}
        {assets.length===0&&<div style={{textAlign:"center",color:"#3a3028",padding:"40px 0",fontSize:13}}>資産がありません</div>}
        {Object.entries(TYPE_LABELS).map(([type,label])=>{
          const group=assets.filter(a=>a.type===type); if(!group.length) return null;
          return (
            <div key={type}>
              <div style={{fontSize:11,color:TYPE_COLORS[type],marginBottom:6,display:"flex",alignItems:"center",gap:4}}>{TYPE_ICONS[type]} {label}</div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {group.map(a=>(
                  <div key={a.id} style={{background:"#141414",border:"1px solid #2e2a22",borderRadius:10,padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,color:"#d4c9b0",fontWeight:600}}>{a.name}</div>
                      <div style={{fontSize:11,color:"#5a5040",marginTop:2}}>{a.type!=="cash"?`${Number(a.amount).toLocaleString()} × ¥${Number(a.price).toLocaleString()}`:`¥${Number(a.amount).toLocaleString()}`}</div>
                      {a.gainRate!==undefined&&a.gainRate!==0&&<div style={{fontSize:11,color:a.gainRate>=0?"#8BA888":"#c87e7e",marginTop:1}}>取得来: {a.gainRate>=0?"+":""}{a.gainRate.toFixed(2)}%</div>}
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:14,fontWeight:700,color:"#f0ead6"}}>{formatJPY(a.amount*a.price)}</div>
                      <div style={{fontSize:10,color:"#5a5040"}}>{total>0?((a.amount*a.price/total)*100).toFixed(1):0}%</div>
                    </div>
                    <div style={{display:"flex",gap:4}}>
                      <button onClick={()=>{setForm({type:a.type,name:a.name,ticker:a.ticker||"",amount:String(a.amount),price:String(a.price)});setEditId(a.id);setShowAdd(true);}} style={{background:"transparent",border:"1px solid #2e2a22",borderRadius:6,color:"#C8A97E",padding:"3px 7px",fontSize:11,cursor:"pointer"}}>編集</button>
                      <button onClick={()=>setAssets(assets.filter(x=>x.id!==a.id))} style={{background:"transparent",border:"1px solid #2e2a22",borderRadius:6,color:"#8B4444",padding:"3px 7px",fontSize:11,cursor:"pointer"}}>削除</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TargetPanel({ targets, setTargets, onClose }) {
  const [vals, setVals] = React.useState(targets);
  const total = Object.values(vals).reduce((s,v)=>s+v,0);
  const diff = 100 - total;
  const is = {background:"#0d0d0d",border:"1px solid #2e2a22",borderRadius:8,color:"#d4c9b0",fontFamily:"'Noto Serif JP',serif",fontSize:13,padding:"6px 10px",width:64,textAlign:"right",outline:"none"};
  const cats = [
    {key:"cash", label:"現金・預金", color:"#7E9EC8"},
    {key:"nikkei", label:"日経平均連動", color:"#C8A97E"},
    {key:"topix", label:"TOPIX連動", color:"#8BA888"},
    {key:"sp500", label:"S&P500連動", color:"#7EC8B8"},
    {key:"world", label:"先進国（除く米国）", color:"#9E8EC8"},
    {key:"gold", label:"金・金ETF", color:"#D4AF37"},
  ];
  function save() {
    if(Math.abs(diff)>0.1){alert(`合計が${total.toFixed(1)}%です。100%になるよう調整してください。`);return;}
    setTargets(vals);
    try{localStorage.setItem("ideal_targets",JSON.stringify(vals));}catch{}
    onClose();
  }
  return (
    <div style={{position:"fixed",inset:0,background:"#000c",zIndex:300,display:"flex",alignItems:"flex-end"}} onClick={onClose}>
      <div style={{background:"#141414",border:"1px solid #2e2a22",borderRadius:"16px 16px 0 0",padding:24,width:"100%",maxWidth:800,margin:"0 auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:14,color:"#C8A97E",fontWeight:700}}>🎯 理想配分を設定</div>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:"#5a5040",fontSize:22,cursor:"pointer"}}>×</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
          {cats.map(c=>(
            <div key={c.key} style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:8,height:8,borderRadius:2,background:c.color,flexShrink:0}}/>
              <div style={{flex:1,fontSize:12,color:"#d4c9b0"}}>{c.label}</div>
              <div style={{display:"flex",alignItems:"center",gap:4}}>
                <input type="number" min="0" max="100" step="1" value={vals[c.key]} onChange={e=>setVals(v=>({...v,[c.key]:Number(e.target.value)}))} style={is}/>
                <span style={{fontSize:12,color:"#5a5040"}}>%</span>
              </div>
            </div>
          ))}
        </div>
        <div style={{textAlign:"center",fontSize:12,color:Math.abs(diff)<0.1?"#8BA888":"#c87e7e",marginBottom:12}}>
          合計：{total.toFixed(1)}% {Math.abs(diff)>0.1&&`（${diff>0?"+":""}${diff.toFixed(1)}%）`}
        </div>
        <button onClick={save} style={{background:"linear-gradient(135deg,#C8A97E,#a8855a)",border:"none",borderRadius:8,color:"#1a1a1a",padding:"12px",width:"100%",fontFamily:"'Noto Serif JP',serif",fontSize:13,cursor:"pointer",fontWeight:700}}>保存</button>
      </div>
    </div>
  );
}

function FamilyView({ data, setData, historyRecords }) {
  const [showBulkCSV, setShowBulkCSV] = useState(false);
  const [showTarget, setShowTarget] = useState(false);
  const [copyStatus, setCopyStatus] = useState("");
  const [targets, setTargets] = useState(()=>{
    try{const s=localStorage.getItem("ideal_targets");if(s)return JSON.parse(s);}catch{}
    return {cash:40,nikkei:15,topix:15,sp500:15,world:15,gold:10};
  });

  function handleBulkImport(byMember, mode, isAuto) {
    if (isAuto) {
      if (mode === "replace") {
        setData(byMember);
      } else {
        setData(d => {
          const nd = {...d};
          Object.entries(byMember).forEach(([id, assets]) => {
            nd[id] = [...(nd[id]||[]), ...assets];
          });
          return nd;
        });
      }
    }
  }

  // Claudeに共有するデータをクリップボードにコピー
  function copyToClipboard() {
    const rd = window.REAL_DATA;
    const hd = window.HISTORY_DATA;
    const allA = Object.values(rd).flat();
    const familyTotal = allA.reduce((s,a)=>s+a.amount*a.price,0);
    const familyCost = allA.reduce((s,a)=>s+(a.cost||a.amount*a.price),0);
    const familyGainRate = familyCost>0?(familyTotal-familyCost)/familyCost*100:0;

    const memberSummary = ["self","wife","daughter","son"].map(id=>{
      const m = rd[id]||[];
      const total = m.reduce((s,a)=>s+a.amount*a.price,0);
      const cost = m.reduce((s,a)=>s+(a.cost||a.amount*a.price),0);
      const gr = cost>0?(total-cost)/cost*100:0;
      const names = {self:"自分",wife:"妻",daughter:"長女",son:"長男"};
      return `  ${names[id]}: ${Math.round(total/10000)}万円 (取得来${gr>=0?"+":""}${gr.toFixed(1)}%)`;
    }).join("\n");

    const catSummary = [
      {label:"現金・預金", filter:a=>a.type==="cash"},
      {label:"純金ETF・金", filter:a=>a.type==="gold"},
      {label:"日経平均連動", filter:a=>a.type==="fund"&&a.name.includes("日経")},
      {label:"TOPIX連動", filter:a=>a.type==="fund"&&a.name.includes("TOPIX")},
      {label:"S&P500連動", filter:a=>a.type==="fund"&&a.name.includes("S&P500")},
      {label:"先進国株式", filter:a=>a.type==="fund"&&a.name.includes("先進国")},
      {label:"年金", filter:a=>a.type==="fund"&&a.name.includes("年金")},
    ].map(cat=>{
      const items = allA.filter(cat.filter);
      if(!items.length) return null;
      const val = items.reduce((s,a)=>s+a.amount*a.price,0);
      const cost = items.reduce((s,a)=>s+(a.cost||a.amount*a.price),0);
      const gr = cost>0?(val-cost)/cost*100:0;
      return `  ${cat.label}: ${Math.round(val/10000)}万円 (${(val/familyTotal*100).toFixed(1)}% / 取得来${gr>=0?"+":""}${gr.toFixed(1)}%)`;
    }).filter(Boolean).join("\n");

    const perfSummary = hd ? Object.entries(hd).map(([k,v])=>{
      if(k==="now") return null;
      const diff = hd.now.total - v.total;
      return `  ${v.label}(${v.date}): ${Math.round(v.total/10000)}万円 → 現在${Math.round(hd.now.total/10000)}万円 (${diff>=0?"+":""}${Math.round(diff/10000)}万円)`;
    }).filter(Boolean).join("\n") : "";

    const text = `【家族資産データ ${new Date().toLocaleDateString("ja-JP")}時点】

■ 家族総資産: ${Math.round(familyTotal/10000)}万円
  取得来損益: ${familyGainRate>=0?"+":""}${familyGainRate.toFixed(1)}% (${familyGainRate>=0?"+":""}${Math.round((familyTotal-familyCost)/10000)}万円)

■ メンバー別
${memberSummary}

■ カテゴリ別
${catSummary}

■ 推移
${perfSummary}

■ 理想配分目標
  現金:${targets.cash}% / 日経:${targets.nikkei}% / TOPIX:${targets.topix}% / S&P500:${targets.sp500}% / 先進国:${targets.world}% / 金:${targets.gold}%
`;
    navigator.clipboard.writeText(text).then(()=>{
      setCopyStatus("✅ コピーしました！Claudeに貼り付けてください");
      setTimeout(()=>setCopyStatus(""),4000);
    }).catch(()=>{
      setCopyStatus("❌ コピーに失敗しました");
      setTimeout(()=>setCopyStatus(""),3000);
    });

// 推移グラフコンポーネント
function HistoryChart({ records, valueKey, color }) {
  if (!records || records.length === 0) {
    return <div style={{textAlign:"center",color:"#3a3028",padding:"24px 0",fontSize:12}}>データがまだありません。来月以降自動で蓄積されます。</div>;
  }
  if (records.length === 1) {
    return <div style={{textAlign:"center",color:"#5a5040",padding:"16px 0",fontSize:12}}>📍 {records[0].recorded_at}：{formatJPY(records[0][valueKey])}<br/><span style={{fontSize:10,color:"#3a3028"}}>来月以降グラフが表示されます</span></div>;
  }
  const vals = records.map(r => r[valueKey]);
  const minV = Math.min(...vals);
  const maxV = Math.max(...vals);
  const range = maxV - minV || 1;
  const W = 320, H = 100, pad = 24;
  const points = records.map((r, i) => {
    const x = pad + (i / (records.length - 1)) * (W - pad * 2);
    const y = H - pad - ((r[valueKey] - minV) / range) * (H - pad * 2);
    return { x, y, r };
  });
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
  const areaPath = `${path} L ${points[points.length-1].x} ${H-pad} L ${points[0].x} ${H-pad} Z`;
  return (
    <div style={{overflowX:"auto"}}>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{display:"block",margin:"0 auto"}}>
        <defs>
          <linearGradient id={"g_"+valueKey} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
            <stop offset="100%" stopColor={color} stopOpacity="0.02"/>
          </linearGradient>
        </defs>
        <path d={areaPath} fill={"url(#g_"+valueKey+")"}/>
        <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        {points.map((p, i) => (
          <g key={i}>
            <circle cx={p.x} cy={p.y} r={3} fill={color}/>
            <text x={p.x} y={H-4} textAnchor="middle" fill="#3a3028" fontSize="8" fontFamily="Noto Serif JP,serif">
              {p.r.recorded_at.slice(5)}
            </text>
          </g>
        ))}
        <text x={pad} y={pad-4} fill="#5a5040" fontSize="8" fontFamily="Noto Serif JP,serif">{formatJPY(maxV)}</text>
        <text x={pad} y={H-pad+12} fill="#5a5040" fontSize="8" fontFamily="Noto Serif JP,serif">{formatJPY(minV)}</text>
      </svg>
    </div>
  );
}

            const active=activeMember===m.id;
            return (
              <button key={m.id} onClick={()=>setActiveMember(m.id)} style={{background:active?"#141414":"transparent",borderTop:"none",borderLeft:"none",borderRight:"1px solid #1e1a14",borderBottom:active?"2px solid #C8A97E":"2px solid transparent",padding:"12px 20px",cursor:"pointer",minWidth:80,flexShrink:0}}>
                <div style={{fontSize:20}}>{m.icon}</div>
                <div style={{fontSize:11,color:active?"#C8A97E":"#5a5040",marginTop:2}}>{m.name}</div>
                <div style={{fontSize:10,color:active?"#a8855a":"#3a3028",marginTop:1}}>{formatJPY(t)}</div>
              </button>
            );
          })}
        </div>
        <div style={{maxWidth:800,margin:"0 auto",padding:16,animation:"fadeUp 0.3s ease"}}>
          {activeMember==="family"
            ? <FamilyView data={data} setData={setData}/>
            : <MemberView key={activeMember} member={MEMBERS.find(m=>m.id===activeMember)} assets={data[activeMember]||[]} setAssets={a=>setMemberAssets(activeMember,a)}/>
          }
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
